<div class="susync-root">
    <a href="#" class="logo-link">
        <div class="logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
        </div>
        <span class="logo-text">Susync</span>
    </a>

    <div class="auth-card">
        <div class="tab-switcher">
            <button class="tab-btn active">Login</button>
            <button class="tab-btn">Register</button>
        </div>

        <div class="form-title">
            <h2>Welcome back</h2>
            <p>Sign in to your Susync account</p>
        </div>

        <div class="form-field">
            <label>Email Address</label>
            <input type="email" placeholder="you@email.com">
        </div>

        <div class="form-field">
            <label>Password</label>
            <div class="input-with-icon">
                <input type="password" placeholder="Password">
                <button type="button" class="password-toggle-btn" aria-label="Show password">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off">
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>
                    </svg>
                </button>
            </div>
        </div>

        <div style="text-align: right; margin-bottom: 16px;">
            <a href="#" style="font-size: 12px; color: var(--primary-500); text-decoration: none; font-weight: 600;">Forgot Password?</a>
        </div>

        <button class="btn-submit">Login</button>
    </div>

    <div class="trust-badges">
        <div class="badge">🔒 256-bit SSL</div>
        <div class="badge">🛡️ DICT Compliant</div>
        <div class="badge">✅ Secure Platform</div>
    </div>
</div>
