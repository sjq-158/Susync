<div class="susync-root">
    <a href="#" class="logo-link">
        <div class="logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        </div>
        <span class="logo-text">Susync</span>
    </a>

    <div class="auth-card">
        <div class="tab-switcher">
            <button class="tab-btn active">Login</button>
            <button class="tab-btn">Register</button>
        </div>

        <div class="form-title">
            <h2>Welcome back</h2>
            <p>Sign in to your Susync account</p>
        </div>

        <div class="form-field">
            <label>Email Address</label>
            <input type="email" value="9123456789">
        </div>

        <div class="form-field">
            <label>Password</label>
            <div class="input-with-icon">
                <input type="text" value="9123456789">
                <button type="button" class="password-toggle-btn" aria-label="Hide password">
                    <span class="material-icons" style="font-size: 18px;">visibility</span>
                </button>
            </div>
        </div>

        <div style="text-align: right; margin-bottom: 16px;">
            <a href="#" style="font-size: 12px; color: var(--primary-500); text-decoration: none; font-weight: 600;">Forgot Password?</a>
        </div>

        <button class="btn-submit">Login</button>
    </div>

    <div class="trust-badges">
        <div class="badge"><span class="material-icons" style="font-size: 18px; vertical-align: middle;">lock</span> 256-bit SSL</div>
        <div class="badge"><span class="material-icons" style="font-size: 18px; vertical-align: middle;">shield</span> DICT Compliant</div>
        <div class="badge"><span class="material-icons" style="font-size: 18px; vertical-align: middle;">check_circle</span> Secure Platform</div>
    </div>
</div>
