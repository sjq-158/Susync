<div class="susync-root">
    <a href="#" class="logo-link">
        <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></div>
        <span class="logo-text">Susync</span>
    </a>

    <div class="auth-card">
        <div class="tab-switcher">
            <button class="tab-btn">Login</button>
            <button class="tab-btn active">Register</button>
        </div>

        <div class="form-title">
            <h2>Create your account</h2>
            <p>Join thousands of Filipino property seekers</p>
        </div>

        <div class="field-grid">
            <div class="form-field"><label>First Name</label><input type="text" value="Ericka"></div>
            <div class="form-field"><label>Last Name</label><input type="text" value="Reign"></div>
        </div>

        <div class="form-field"><label>Email Address</label><input type="email" value="ericka@example.com"></div>

        <div class="form-field">
            <label>Password</label>
            <div class="input-with-icon">
                <input type="text" value="SecurePass123!">
                <button type="button" class="password-toggle-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="form-field">
            <label>I am a...</label>
            <div class="role-box">
                <button class="role-opt active">Buyer / Renter</button>
                <button class="role-opt">Seller / Landlord</button>
            </div>
        </div>

        <div class="checkbox-row">
            <input type="checkbox" id="terms-buyer-see" checked>
            <span>I agree to Susync's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
        </div>

        <button class="btn-submit">Create Account</button>
    </div>
</div>
