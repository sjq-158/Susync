<div class="susync-root">
    <a href="#" class="logo-link">
        <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></div>
        <span class="logo-text">Susync</span>
    </a>

    <div class="auth-card">
        <div class="tab-switcher">
            <button class="tab-btn">Login</button>
            <button class="tab-btn active">Register</button>
        </div>

        <div class="form-title">
            <h2>List your property</h2>
            <p>Connect with verified buyers and renters</p>
        </div>

        <div class="field-grid">
            <div class="form-field"><label>First Name</label><input type="text" placeholder="First Name"></div>
            <div class="form-field"><label>Last Name</label><input type="text" placeholder="Last Name"></div>
        </div>

        <div class="form-field"><label>Business Email</label><input type="email" placeholder="business@email.com"></div>

        <div class="form-field">
            <label>Password</label>
            <div class="input-with-icon">
                <input type="password" placeholder="Create a password">
                <button type="button" class="password-toggle-btn">
                    <span class="material-icons" style="font-size: 18px;">visibility_off</span>
                </button>
            </div>
        </div>

        <div class="form-field">
            <label>I am a...</label>
            <div class="role-box">
                <button class="role-opt">Buyer / Renter</button>
                <button class="role-opt active">Seller / Landlord</button>
            </div>
        </div>

        <div class="checkbox-row">
            <input type="checkbox" id="terms-seller">
            <span>I agree to Susync's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
        </div>

        <button class="btn-submit">Create Account</button>
    </div>
</div>
